# Cloudflare Pages project. The static site is in ./site and the API
# (Pages Functions) in ./functions, served together on one domain.
name = "fakktura"
pages_build_output_dir = "./site"
compatibility_date = "2026-09-01"

# Secrets are set in the dashboard (Settings → Variables and Secrets) or:
#   npx wrangler pages secret put SVV_API_KEY
